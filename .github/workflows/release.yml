name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/../zig-global
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Linux windowing headers for SDL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxfixes-dev libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libasound2-dev libudev-dev pkg-config
      - name: Check formatting
        run: zig build check
      - name: Build
        run: zig build --release=safe
      - name: Test
        run: zig build test
      - name: Stage distribution files
        shell: bash
        run: |
          mkdir -p dist
          cp zig-out/bin/* dist/
          cp README.md LICENSE NOTICE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: raw
      # One job packs every platform so the archive names and the checksum file are consistent.
      - name: Package archives
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          mkdir -p release
          for dir in raw/raw-*; do
            base="${dir#raw/raw-}"
            arch="${base##*-}"
            os="${base%-*}"
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/release/ps4-pkg2zar-${tag}-${os}-${arch}.zip" .)
          done
          (cd release && sha256sum ./*.zip > sha256sums.txt)
          ls -l release
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.zip release/sha256sums.txt --clobber
          else
            gh release create "$tag" release/*.zip release/sha256sums.txt \
              --title "$tag" --generate-notes
          fi
