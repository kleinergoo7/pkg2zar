name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS is off: the hosted arm64 runners were not acquired at all. Re-add
        # macos-latest here and in release.yml when the capacity problem clears.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Keep the global cache out of the checkout; setup-zig points both caches at one
      # directory otherwise, which made cache writes fail.
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/../zig-global
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Linux windowing headers for SDL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxfixes-dev libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libasound2-dev libudev-dev pkg-config
      - name: Check formatting
        run: zig build check
      - name: Build
        # baseline CPU: a native build crashes with SIGILL on older machines.
        run: zig build --release=safe -Dcpu=baseline
      - name: Test
        run: zig build test
      # A downloaded zip must explain itself: binaries alone do not name the licence or the tool.
      - name: Stage distribution files
        shell: bash
        run: |
          mkdir -p dist
          cp zig-out/bin/* dist/
          cp README.md LICENSE NOTICE dist/
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ps4-pkg2zar-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
