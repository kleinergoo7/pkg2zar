name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Separate Zig caches
        shell: bash
        run: echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-global" >> "$GITHUB_ENV"
      - name: Linux windowing headers for SDL
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxfixes-dev libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libasound2-dev libudev-dev pkg-config
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ps4-pkg2zar-${{ matrix.os }}
          path: zig-out/bin/
          if-no-files-found: error
